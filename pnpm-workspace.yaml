# A lane exists because its folder exists. Adding benchmark/<name>/ with a
# package.json is enough for `pnpm install` at the root to install it -- there
# is no list to keep in sync here or anywhere else.
packages:
  - scoreboard/
  - benchmark/*/

# One version of the types every lane compiles against. A lane that pinned its
# own would be typechecking against a different standard library than the
# control it is measured against, which is a difference in the harness rather
# than in the library under test.
catalog:
  "@types/node": ^24.8.1

allowBuilds:
  "@swc/core": true
  esbuild: true
  sharp: true

minimumReleaseAge: 0
