name: Benchmark

# One machine, one run, every lane: build times are only comparable when they
# were taken next to each other, so the whole suite stays in a single job on a
# single runner.
on:
  workflow_dispatch:
    inputs:
      iterations:
        description: Cold builds per lane (the first is a discarded warm-up).
        type: string
        required: false
        default: "10"
      scale_counts:
        description: Distinct styled definitions to sweep, comma separated.
        type: string
        required: false
        default: "10,100,1000"
      lanes:
        description: Restrict to these lanes (comma separated); the control lane is always included.
        type: string
        required: false
        default: ""
  schedule:
    # Weekly, so a dependency bump that changes a number is caught without
    # anyone pushing.
    - cron: "17 3 * * 1"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/benchmark.yml"
      - ".nvmrc"
      - "benchmark/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.benchmark.json"

permissions:
  contents: read

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: false

env:
  BENCHMARK_ITERATIONS: ${{ github.event.inputs.iterations || '10' }}
  BENCHMARK_SCALE_COUNTS: ${{ github.event.inputs.scale_counts || '10,100,1000' }}
  BENCHMARK_LANES: ${{ github.event.inputs.lanes || '' }}
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  measure:
    name: Ubuntu benchmark
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A cheap gate: a type error should cost seconds, not an hour of builds.
      - name: Type-check the harness and the scoreboard
        run: pnpm typecheck

      # Each measurement continues past a broken lane and records it, so one
      # failing library still leaves every other lane measured and publishable.
      # The gate step below turns any of these failures into a red run.
      - name: Cold-build benchmark
        id: bench
        continue-on-error: true
        shell: bash
        run: set -o pipefail && pnpm bench 2>&1 | tee benchmark.log

      - name: Distinct-definition scale sweep
        id: scale
        continue-on-error: true
        shell: bash
        run: set -o pipefail && pnpm bench:scale 2>&1 | tee scale.log

      - name: Binding escape probe
        id: binding
        continue-on-error: true
        shell: bash
        run: set -o pipefail && pnpm bench:binding 2>&1 | tee binding.log

      - name: Server and client structure
        id: structure
        continue-on-error: true
        shell: bash
        run: set -o pipefail && pnpm structure --client 2>&1 | tee structure.log

      - name: Check for a publishable result
        id: results
        if: always()
        shell: bash
        run: |
          if [ -s scoreboard/public/latest.json ]; then
            echo "has-results=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-results=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Benchmark environment"
            echo
            echo "- Runner: ubuntu-24.04 ($(nproc) cores)"
            echo "- Node: $(node --version) · pnpm: $(pnpm --version)"
            echo "- Iterations: ${BENCHMARK_ITERATIONS} · scale counts: ${BENCHMARK_SCALE_COUNTS} · lanes: ${BENCHMARK_LANES:-all}"
            echo
            echo "| Measurement | Result |"
            echo "| :--- | :--- |"
            echo "| Cold build | ${{ steps.bench.outcome }} |"
            echo "| Scale sweep | ${{ steps.scale.outcome }} |"
            echo "| Binding escape | ${{ steps.binding.outcome }} |"
            echo "| Structure | ${{ steps.structure.outcome }} |"
            echo
            echo "> Shared CI runners are noisy. Treat these numbers as a check that the"
            echo "> relative trend reproduces on another OS and CPU, not as absolute timings."
            echo
            for log in benchmark scale binding structure; do
              echo "## ${log}"
              echo
              echo '```text'
              tail -c 40000 "${log}.log" 2>/dev/null || echo "No log was produced."
              echo '```'
              echo
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always() && steps.results.outputs.has-results == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: scoreboard/public/latest.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload raw logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-logs
          path: |
            benchmark.log
            scale.log
            binding.log
            structure.log
          if-no-files-found: warn
          retention-days: 90

      - name: Fail if any measurement failed
        if: always()
        shell: bash
        run: |
          failed=0
          for outcome in "${{ steps.bench.outcome }}" "${{ steps.scale.outcome }}" "${{ steps.structure.outcome }}"; do
            [ "$outcome" = "success" ] || failed=1
          done
          if [ "$failed" = "1" ]; then
            echo "::error::At least one measurement failed; see the job summary for the failing lanes."
            exit 1
          fi
