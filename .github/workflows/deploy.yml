name: deploy

on:
  push:
    branches: ["main"]

  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Setup Pages
        uses: actions/configure-pages@v5
        
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter css-compiler-benchmark-scoreboard
      - name: Take the last successful benchmark result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list --workflow benchmark.yml --status success --limit 1 \
            --json databaseId --jq '.[0].databaseId // empty')
          if [ -z "$run_id" ]; then
            echo "::warning::No successful benchmark run yet; the site will render its empty state."
            exit 0
          fi
          echo "Publishing the result measured by run ${run_id}."
          gh run download "$run_id" --name benchmark-ublic
      - name: Build with Vite
        run: pnpm build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./scoreboard/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
