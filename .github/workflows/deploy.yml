name: deploy

on:
  workflow_run:
    workflows: ["Benchmark"]
    types: [completed]

  push:
    branches: ["main"]
    paths:
      - ".github/workflows/deploy.yml"
      - "scoreboard/**"

  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    outputs:
      has-results: ${{ steps.result.outputs.has-results }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter css-compiler-benchmark-scoreboard
      - name: Take the benchmark result
        id: result
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGERING_RUN: ${{ github.event.workflow_run.id }}
        run: |
          run_id="$TRIGGERING_RUN"
          if [ -z "$run_id" ]; then
            run_id=$(gh run list --workflow benchmark.yml --status success --limit 1 \
              --json databaseId --jq '.[0].databaseId // empty')
          fi
          if [ -z "$run_id" ]; then
            echo "::warning::No benchmark run has produced a result yet; nothing to deploy."
            echo "has-results=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! gh run download "$run_id" --name benchmark-results --dir scoreboard/public; then
            echo "::warning::Run ${run_id} published no result artifact; nothing to deploy."
            echo "has-results=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Publishing the result measured by run ${run_id}."
          node -e "const r=require('./scoreboard/public/latest.json');console.log('generatedAt:',r.generatedAt,'| build:',r.build?.status??'missing','| scale:',r.scale?.status??'missing','| structure:',r.structure?.status??'missing')"
          echo "has-results=true" >> "$GITHUB_OUTPUT"
      - name: Build with Vite
        if: steps.result.outputs.has-results == 'true'
        run: pnpm build
      - name: Upload artifact
        if: steps.result.outputs.has-results == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./scoreboard/dist

  deploy:
    needs: build
    if: needs.build.outputs.has-results == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
